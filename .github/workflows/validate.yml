name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Committed output matches the pinned upstream
        run: python3 scripts/sync.py --check
      - name: Grok artifact invariants
        run: ruby tests/validate.rb
      - name: Grok inspection regressions
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      # `grok plugin validate plugins/aquarium` is a local install-time check
      # listed in README.md; the runner has no grok binary.
      - name: Trailing whitespace in committed files
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD
